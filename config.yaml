llm:
  provider: groq
  model: "openai/gpt-oss-120b"
  temperature: 0
  max_retries: 4          # ChatGroq retries with backoff on 429 rate limits
  max_tokens: 2048        # NOTE: not applied -- reasoning models spend this on thinking tokens

embedding:
  model: jinaai/jina-embeddings-v2-base-code
  batch_size: 2           # was 2; lower it if you run out of memory

vector_db:
  collection_name: rag_repo_collection
  vector_size: 768        # must match the embedding model
  url: "http://localhost:6333"   # Qdrant server (docker run -p 6333:6333 qdrant/qdrant)
  path: null              # OR set to "qdrant_storage" to use embedded mode (no server needed)

retrieval:
  candidate_limit: 10    # vectors fetched from Qdrant before rerank
  final_result_count: 4   # chunks handed to the agent
  max_chunks_per_file: 2
  min_rerank_score: -2.0
  max_context_tokens: 3000

orchestrator:
  enable_planner: true    # rewrite question + classify intent + split into sub-questions
  enable_verifier: true   # LLM check of the answer vs. evidence (citation check always runs)
  max_subquestions: 3
  max_revisions: 1        # hard cap on revise->verify rounds
  history_turns: 4        # previous Q&A turns the planner can see
  route_budgets:          # max tool rounds the retrieval agent may use per sub-question
    lookup: 3
    explain_flow: 5
    architecture: 6

logging:
  level: "INFO"            # DEBUG, INFO, WARNING, ERROR
  log_file: "logs/pipeline.log"
  max_bytes: 5242880       # 5 MB per file
  backup_count: 3          # Keep up to 3 rotated backups
  enable_console: true
